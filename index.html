<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2等無人航空機操縦士 飛行前点検トレーニング (高音質版)</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --success: #22c55e;
            --danger: #ef4444;
        }
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 1.5rem;
            color: var(--text-main);
            margin-bottom: 8px;
        }
        .header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin: 0;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            margin-bottom: 20px;
        }
        .dialogue-box {
            margin-bottom: 20px;
            padding: 16px;
            border-radius: 8px;
            background-color: #f1f5f9;
            border-left: 4px solid var(--primary);
        }
        .dialogue-box.user {
            border-left: 4px solid var(--success);
            background-color: #f0fdf4;
        }
        .label {
            font-size: 0.8rem;
            font-weight: bold;
            color: var(--text-muted);
            margin-bottom: 4px;
            display: block;
        }
        .text {
            font-size: 1.1rem;
            line-height: 1.5;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        button {
            border: none;
            border-radius: 8px;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
        }
        .btn-primary {
            background-color: var(--primary);
            color: white;
        }
        .btn-primary:hover {
            background-color: var(--primary-hover);
        }
        .btn-secondary {
            background-color: #e2e8f0;
            color: var(--text-main);
        }
        .btn-secondary:hover {
            background-color: #cbd5e1;
        }
        #judgment {
            text-align: center;
            font-weight: bold;
            margin-top: 10px;
            min-height: 24px;
        }
        .success-text { color: var(--success); }
        .danger-text { color: var(--danger); }
        .progress {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-align: right;
            margin-bottom: 10px;
        }
        #voiceStatus {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>実技試験 音声トレーニング</h1>
            <p>飛行前点検（地上点検）</p>
        </div>
        
        <div class="progress" id="progressInfo">ステップ: 0 / 0</div>

        <div class="card">
            <div class="dialogue-box">
                <span class="label">【試験官】</span>
                <div class="text" id="examinerMsg">（開始ボタンを押してください）</div>
            </div>
            
            <div class="dialogue-box user">
                <span class="label">【操縦者】</span>
                <div class="text" id="userMsg">（あなたのセリフがここに表示されます）</div>
            </div>
            
            <div id="judgment"></div>
        </div>

        <div class="controls">
            <button class="btn-primary" id="mainBtn">▶ 試験官の音声を再生して開始</button>
            <button class="btn-secondary" id="skipBtn" style="display:none;">⏭ 手動で次へ進む（認識が止まった場合）</button>
        </div>
        <div id="voiceStatus">音声モデルを読み込み中...</div>
    </div>

    <script>
        const scenario = [
            { ex: "はい、これから飛行前点検を行います。点検用紙を使って航空法で定められる点検内容をはっきりとした声で行ってください。なお、電源を入れて確認する時は試験官に確認を取ってください。必要な準備の確認を行います。体調に問題ありませんか？", user: "はい、体調問題ありません。" },
            { ex: "はい、今回の飛行に対して航空法に基づく手続き、必要事項の確認をしてください。", user: "今回は屋内での飛行になるため、航空法適用外で問題ありません。" },
            { ex: "はい。空域および気象状況の確認を行います。飛行空域の周辺並びに気象状況、風速を確認してください。", user: "はい。周辺の障害物特にありません。屋内での飛行になるため気象状況問題ありません。風速を確認します。風速5m毎秒未満のため問題ありません。" },
            { ex: "はい。それでは飛行前点検を開始いたします。日常点検記録に基づき、飛行前点検をはっきりとした声で始めてください。", user: "はい、飛行前点検を開始します。実施年月日、2025年6月16日と記載します。実施場所、テクニカルセンターと記入します。実施者、ハミング太郎と記入します。無人航空機の登録記号を記入します。JU324A...機体識別表示の確認を行います。剥がれがないか、記号が鮮明に見えるか確認を行います。問題ありません。全般、プロペラ外観、歪みがないか確認を行います。問題ありません。モーター外観、回転、異音の確認を行います。問題ありません。フレーム外観、損傷、歪み確認を行います。問題ありません。ネジ、コネクター、ケーブルと機器の取り付け状態の確認を行います。問題ありません。ケーブルは内蔵型のため点検を行いません。操縦装置、外観、スティックの緩み、スイッチの確認を行います。問題ありません。機体カメラの確認。カメラの損傷がないか確認を行います。問題ありません。灯火の確認。灯火の損傷がないか確認を行います。問題ありません。電源系統の確認。送信機と機体が正常に作動するか確認を行います。電源を入れてもよろしいでしょうか？" },
            { ex: "はい、お願いします。", user: "はい、電源を入れます。まずは送信機の電源をオンにします。続いて機体の電源をオンにします。送信機、機体が正常に作動したことを確認しました。現在の時刻を離陸時刻として記載しますので、時刻を教えてください。" },
            { ex: "はい、現在の時刻12時5分になります。", user: "12時5分、点検シートに記入します。バッテリーの確認。機体、送信機の充電状況は問題ないか確認を行います。機体のバッテリー97%、問題ありません。送信機のバッテリー90%、問題ありません。操縦装置、操縦モードの確認を行います。操縦モード、モード2を確認しました。問題ありません。リモートIDの確認。リモートIDの電源が入っているか、インポート済みかの確認を行います。リモートIDインポート済みを確認しました。問題ありません。画像伝送状況の確認。機体カメラの映像が正常に送信機に反映されているか確認を行います。問題ありません。灯火の確認。無人航空機の灯火が正常に点灯しているか確認を行います。問題ありません。以上で飛行前点検を終了します。" }
        ];
        
        let step = 0;
        let isListening = false;
        let selectedVoice = null;
        
        const mainBtn = document.getElementById('mainBtn');
        const skipBtn = document.getElementById('skipBtn');
        const exMsg = document.getElementById('examinerMsg');
        const userMsg = document.getElementById('userMsg');
        const judgment = document.getElementById('judgment');
        const progressInfo = document.getElementById('progressInfo');
        const voiceStatus = document.getElementById('voiceStatus');
        
        // 高音質な音声モデルを取得する関数
        function loadVoices() {
            const voices = speechSynthesis.getVoices();
            if (voices.length === 0) return;
            
            // Google、Mac、Windowsの高品質な日本語音声を優先的に探す
            selectedVoice = voices.find(v => v.lang === 'ja-JP' && v.name.includes('Google')) || 
                            voices.find(v => v.lang === 'ja-JP' && v.name.includes('Kyoko')) || 
                            voices.find(v => v.lang === 'ja-JP' && v.name.includes('Nanami')) || 
                            voices.find(v => v.lang === 'ja-JP');
            
            if (selectedVoice) {
                voiceStatus.innerText = `現在の音声モデル: ${selectedVoice.name}`;
            }
        }
        
        // 音声リストが読み込まれた時に実行（ブラウザによっては非同期）
        speechSynthesis.onvoiceschanged = loadVoices;
        // 即時実行も試みる
        loadVoices();
        
        function updateProgress() {
            progressInfo.innerText = `ステップ: ${step + 1} / ${scenario.length}`;
        }
        updateProgress();

        mainBtn.addEventListener('click', () => {
            if (step >= scenario.length) {
                alert("すべての練習が終了しました。お疲れ様でした！");
                step = 0;
                updateProgress();
                mainBtn.innerText = "▶ 最初からやり直す";
                return;
            }
            
            mainBtn.disabled = true;
            skipBtn.style.display = 'block';
            
            const currentEx = scenario[step].ex;
            exMsg.innerText = currentEx;
            userMsg.innerText = "（マイクに向かって発話してください...）";
            userMsg.style.color = "var(--text-muted)";
            judgment.innerText = "";
            judgment.className = "";

            const ut = new SpeechSynthesisUtterance(currentEx);
            ut.lang = 'ja-JP';
            ut.rate = 1.0; 
            ut.pitch = 1.0;
            if (selectedVoice) {
                ut.voice = selectedVoice; // 高音質モデルを適用
            }
            speechSynthesis.speak(ut);

            ut.onend = () => {
                startRecognition();
            };
        });
        
        function startRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return;
            
            const recognition = new SpeechRecognition();
            recognition.lang = 'ja-JP';
            recognition.continuous = true; 
            recognition.interimResults = false;
            
            let fullTranscript = "";
            
            recognition.onstart = () => {
                isListening = true;
                userMsg.innerText = "🎤 認識中... (長文の場合は話し続けてください)";
                userMsg.style.color = "var(--text-main)";
            };
            
            recognition.onresult = (event) => {
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        fullTranscript += event.results[i][0].transcript;
                    }
                }
                userMsg.innerText = fullTranscript;
                checkAnswer(fullTranscript);
            };
            
            recognition.onerror = (event) => {
                userMsg.innerText = "音声認識エラー: " + event.error + " (手動で次へ進んでください)";
                mainBtn.disabled = false;
                mainBtn.innerText = "▶ もう一度試す";
            };
            
            recognition.onend = () => {
                isListening = false;
            };
            
            recognition.start();
        }
        
        function checkAnswer(transcript) {
            const expected = scenario[step].user;
            const keywords = expected.substring(0, 5).replace(/[、。]/g, ''); 
            
            if (transcript.replace(/[、。\s]/g, '').includes(keywords)) {
                judgment.innerText = "⭕️ 確認しました！";
                judgment.className = "success-text";
                step++;
                mainBtn.disabled = false;
                mainBtn.innerText = "▶ 次のステップへ";
                skipBtn.style.display = 'none';
                updateProgress();
            } else {
                judgment.innerText = "❌ 認識結果が一致しません。正しくは: 「" + expected.substring(0, 15) + "...」";
                judgment.className = "danger-text";
                mainBtn.disabled = false;
                mainBtn.innerText = "▶ もう一度発話する";
            }
        }
        
        skipBtn.addEventListener('click', () => {
            step++;
            updateProgress();
            mainBtn.disabled = false;
            mainBtn.innerText = "▶ 次のステップへ";
            skipBtn.style.display = 'none';
            userMsg.innerText = "（スキップしました）";
            judgment.innerText = "";
            
            if (step >= scenario.length) {
                exMsg.innerText = "すべての行程が終了しました。";
                mainBtn.innerText = "▶ 最初からやり直す";
            }
        });
    </script>
</body>
</html>
