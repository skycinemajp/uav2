<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音声反復練習 — </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B1420;
    --panel:#101E2C;
    --panel-alt:#16283A;
    --line:#28405A;
    --text:#E4ECF2;
    --muted:#7E97AC;
    --amber:#E3A83B;
    --success:#4FAE7C;
    --error:#D9614E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Noto Sans JP',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:720px; margin:0 auto; padding:28px 20px 60px; }
  .callsign{ font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.12em; color:var(--amber); }
  .examiner-header{ display:flex; gap:10px; margin:10px 0 4px; }
  .examiner-header-img{
    width:56px; height:56px; border-radius:8px; object-fit:cover;
    border:1px solid var(--line);
  }
  h1{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:26px; margin:6px 0 4px; letter-spacing:-0.01em; }
  .sub{ color:var(--muted); font-size:13.5px; line-height:1.6; margin:0 0 18px; max-width:58ch; }

  .settings{
    display:flex; flex-wrap:wrap; gap:14px;
    background:var(--panel); border:1px solid var(--line); border-radius:4px;
    padding:12px 16px; margin-bottom:18px;
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--muted);
    align-items:center;
  }
  .settings label{ display:flex; align-items:center; gap:6px; cursor:pointer; }
  .settings select{
    background:var(--panel-alt); color:var(--text); border:1px solid var(--line);
    border-radius:3px; font-family:'IBM Plex Mono',monospace; font-size:11.5px; padding:3px 6px;
  }
  .unsupported{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--error);
    border:1px solid var(--error); border-radius:4px; padding:10px 14px; margin-bottom:18px;
  }

  .tabs{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px; }
  .tab{
    font-family:'IBM Plex Mono',monospace; font-size:12px; padding:8px 12px;
    border:1px solid var(--line); border-radius:3px; background:var(--panel);
    color:var(--muted); cursor:pointer; transition:border-color .15s, color .15s;
  }
  .tab:hover{border-color:#3C5875;}
  .tab.active{ border-color:var(--amber); color:var(--amber); }

  .phase-track{ display:flex; gap:4px; margin-bottom:8px; }
  .phase-track .dot{ flex:1; height:3px; background:var(--line); border-radius:2px; }
  .phase-track .dot.done{background:var(--success);}
  .phase-track .dot.current{background:var(--amber);}

  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:20px 22px; margin-bottom:16px; }
  .role-tag{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.1em; color:var(--muted);
    margin-bottom:8px; display:flex; align-items:center; gap:8px; justify-content:space-between;
  }
  .role-tag .left{ display:flex; align-items:center; gap:8px; }
  .role-tag .sq{width:6px;height:6px;background:var(--amber);}
  .listen-btn{
    font-family:'IBM Plex Mono',monospace; font-size:11px; padding:4px 9px; border-radius:3px;
    border:1px solid var(--line); background:var(--panel-alt); color:var(--muted); cursor:pointer;
  }
  .listen-btn:hover{ border-color:var(--amber); color:var(--amber); }
  .examiner-text{ font-size:16px; line-height:1.85; }
  .examiner-row{ display:flex; gap:14px; align-items:flex-start; }
  .avatar-slot{ flex:0 0 auto; width:64px; height:64px; }
  .avatar-img{
    width:64px; height:64px; border-radius:50%; object-fit:cover;
    border:2px solid var(--amber); display:block;
  }
  .examiner-body{ flex:1 1 auto; min-width:0; }

  .history{ margin-bottom:16px; }
  .history-item{ padding:14px 0; border-bottom:1px solid var(--line); font-size:14px; line-height:1.75; }
  .history-item:last-child{border-bottom:none;}
  .history-item.operator .role-tag .sq{background:var(--success);}
  .history-item .body{color:#C4D3DF;}

  .ptt-area{ display:flex; flex-direction:column; align-items:center; gap:10px; padding:10px 0 4px; }
  .ptt-btn{
    width:100%;
    font-family:'IBM Plex Mono',monospace; font-size:13.5px; letter-spacing:0.06em;
    padding:22px 16px; border-radius:6px; border:1px solid var(--amber);
    background:var(--panel-alt); color:var(--amber); cursor:pointer;
    user-select:none; -webkit-user-select:none; touch-action:none;
    transition:background .1s, color .1s;
  }
  .ptt-btn.active{ background:var(--error); border-color:var(--error); color:#fff; }
  .ptt-btn:disabled{ opacity:0.35; cursor:default; }
  .ptt-hint{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--muted); }

  .transcript-box{
    width:100%; min-height:70px; background:var(--panel-alt); border:1px solid var(--line);
    border-radius:4px; color:var(--text); font-size:15px; line-height:1.7; padding:14px;
    margin-top:6px; white-space:pre-wrap;
  }
  .transcript-box.placeholder{ color:#4F6479; }

  textarea.manual{
    width:100%; min-height:70px; background:var(--panel-alt); border:1px solid var(--line);
    border-radius:4px; color:var(--text); font-family:'Noto Sans JP',sans-serif; font-size:14px;
    line-height:1.7; padding:12px; resize:vertical; margin-top:8px;
  }
  textarea.manual:focus{outline:none; border-color:var(--amber);}

  .controls{ display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; width:100%; }
  button{
    font-family:'IBM Plex Mono',monospace; font-size:12.5px; letter-spacing:0.04em;
    padding:10px 16px; border-radius:3px; border:1px solid var(--line);
    background:var(--panel-alt); color:var(--text); cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  button:hover{border-color:#3C5875;}
  button.primary{ background:var(--amber); border-color:var(--amber); color:#1A1204; font-weight:500; }
  button.primary:hover{filter:brightness(1.05);}

  .verdict{ margin-top:16px; padding:16px 18px; border-radius:4px; border:1px solid; font-size:14px; line-height:1.7; }
  .verdict.pass{border-color:var(--success); background:rgba(79,174,124,0.08);}
  .verdict.fail{border-color:var(--error); background:rgba(217,97,78,0.08);}
  .verdict-head{ font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.08em; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;}
  .verdict.pass .verdict-head{color:var(--success);}
  .verdict.fail .verdict-head{color:var(--error);}
  .ref-text{ margin-top:10px; padding-top:10px; border-top:1px solid var(--line); color:var(--muted); }
  .ref-text b{color:var(--text); font-weight:500;}
  .chunks{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .chunk{ font-size:12px; padding:3px 9px; border-radius:20px; border:1px solid var(--line); color:var(--muted); }
  .chunk.ok{border-color:var(--success); color:var(--success);}
  .chunk.ng{border-color:var(--error); color:var(--error);}

  .complete{ text-align:center; padding:40px 20px; }
  .complete .big{ font-family:'Space Grotesk',sans-serif; font-size:22px; color:var(--success); margin-bottom:8px; }
  .complete p{color:var(--muted); font-size:13.5px;}

  .meta-row{
    display:flex; justify-content:space-between; align-items:center;
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted); margin-bottom:10px;
  }
</style>
</head>

// ---- feature detection ----
const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
const hasSTT = !!SpeechRecognitionAPI;
const hasTTS = 'speechSynthesis' in window;

let recognition = null;
if(hasSTT){
  recognition = new SpeechRecognitionAPI();
  recognition.lang = 'ja-JP';
  recognition.interimResults = true;
  recognition.continuous = true;
}

let availableVoices = [];
let selectedVoiceURI = null;
let speechRate = 0.95;
let speechPitch = 1.0;

let examinerGender = 'female';
let voiceURIByGender = { female: null, male: null };

const FEMALE_NAME_HINTS = ['kyoko','ayumi','nanami','haruka','sayaka','o-ren','oren','josei','female','woman'];
const MALE_NAME_HINTS = ['otoya','ichiro','keita','daichi','takumi','dansei','male','man'];

function classifyVoiceGender(v){
  const n = v.name.toLowerCase();
  if(FEMALE_NAME_HINTS.some(h => n.includes(h))) return 'female';
  if(MALE_NAME_HINTS.some(h => n.includes(h))) return 'male';
  return 'unknown';
}

function scoreVoiceNaturalness(v){
  // Heuristic: network/cloud voices (localService:false) and voices whose
  // name signals a higher-quality engine tend to sound far less robotic
  // than the compact on-device default voices most OSes ship with.
  let score = 0;
  if(v.localService === false) score += 10;
  const name = v.name.toLowerCase();
  if(name.includes('google')) score += 6;
  if(name.includes('natural') || name.includes('neural')) score += 8;
  if(name.includes('enhanced') || name.includes('premium')) score += 6;
  if(name.includes('siri')) score += 4;
  if(name.includes('kyoko') || name.includes('o-ren') || name.includes('otoya')) score += 3;
  if(name.includes('compact')) score -= 4;
  return score;
}

function pickBestVoiceForGender(gender){
  const candidates = availableVoices.filter(v => classifyVoiceGender(v) === gender);
  const pool = candidates.length ? candidates : availableVoices;
  if(!pool.length) return null;
  return [...pool].sort((a,b) => scoreVoiceNaturalness(b) - scoreVoiceNaturalness(a))[0];
}

function isFallbackVoice(gender){
  const uri = voiceURIByGender[gender];
  const voice = availableVoices.find(v => v.voiceURI === uri);
  return !voice || classifyVoiceGender(voice) !== gender;
}

function loadVoices(){
  const all = window.speechSynthesis.getVoices();
  availableVoices = all.filter(v => v.lang && v.lang.toLowerCase().startsWith('ja'));
  if(availableVoices.length === 0) return;
  if(!selectedVoiceURI || !availableVoices.some(v => v.voiceURI === selectedVoiceURI)){
    const best = [...availableVoices].sort((a,b) => scoreVoiceNaturalness(b) - scoreVoiceNaturalness(a))[0];
    selectedVoiceURI = best.voiceURI;
  }
  ['female','male'].forEach(gender => {
    if(!voiceURIByGender[gender] || !availableVoices.some(v => v.voiceURI === voiceURIByGender[gender])){
      const best = pickBestVoiceForGender(gender);
      voiceURIByGender[gender] = best ? best.voiceURI : null;
    }
  });
  if(document.getElementById('settingsRow')){ buildSettings(); }
}
if(hasTTS){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

function refreshVoiceSelect(){
  const sel = document.getElementById('voiceSelect');
  if(sel){
    sel.innerHTML = availableVoices.map(v =>
      `<option value="${v.voiceURI}" ${v.voiceURI===selectedVoiceURI?'selected':''}>${v.name}${v.localService===false?' (高品質)':''}</option>`
    ).join('');
  }
  ['female','male'].forEach(gender => {
    const gsel = document.getElementById(gender === 'female' ? 'femaleVoiceSelect' : 'maleVoiceSelect');
    if(!gsel) return;
    gsel.innerHTML = availableVoices.map(v =>
      `<option value="${v.voiceURI}" ${v.voiceURI===voiceURIByGender[gender]?'selected':''}>${v.name}${v.localService===false?' (高品質)':''}</option>`
    ).join('');
  });
}

function speakWithVoice(text, voiceURI, rate, pitch){
  if(!hasTTS || !text) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP';
  u.rate = rate;
  u.pitch = pitch;
  const voice = availableVoices.find(v => v.voiceURI === voiceURI);
  if(voice) u.voice = voice;
  window.speechSynthesis.speak(u);
}

function speak(text){
  speakWithVoice(text, selectedVoiceURI, speechRate, speechPitch);
}

function speakExaminer(text){
  const uri = voiceURIByGender[examinerGender];
  let pitch = speechPitch;
  if(isFallbackVoice(examinerGender)){
    // No voice actually matching this gender was found — fake it a bit by
    // shifting pitch, rather than silently using an unrelated voice as-is.
    pitch = examinerGender === 'female' ? 1.2 : 0.82;
  }
  speakWithVoice(text, uri, speechRate, pitch);
}

// ---- matching logic ----
function bigrams(str){
  const arr=[];
  for(let i=0;i<str.length-1;i++) arr.push(str.substr(i,2));
  if(arr.length===0 && str.length>0) arr.push(str);
  return arr;
}
function jaccard(a,b){
  const setA=new Set(a), setB=new Set(b);
  if(setA.size===0 && setB.size===0) return 1;
  let inter=0;
  setA.forEach(x=>{ if(setB.has(x)) inter++; });
  const union=new Set([...setA,...setB]).size;
  return union===0?0:inter/union;
}
function normalize(s){
  return s.replace(/[、。！？\s「」『』\.,!?]/g,'');
}
function bestMatchScore(chunkRaw, answerRaw){
  const chunk = normalize(chunkRaw);
  const answer = normalize(answerRaw);
  if(chunk.length===0) return 1;
  if(answer.includes(chunk)) return 1;
  const cb = bigrams(chunk);
  let best = 0;
  const winLen = Math.max(chunk.length, 2);
  for(let i=0;i<=Math.max(answer.length-1,0);i++){
    const window = answer.substr(i, winLen);
    if(window.length < 2) continue;
    const score = jaccard(cb, bigrams(window));
    if(score>best) best=score;
  }
  const wholeScore = jaccard(cb, bigrams(answer));
  return Math.max(best, wholeScore);
}
// ---- fields that legitimately change every time the pilot performs this
// checklist (name, date, registration number, location, times, durations) —
// these are excluded from grading so a different date/name/time doesn't
// count as a wrong answer. The full original text is still shown and
// spoken aloud; only the grading copy has these values removed.
const VARIABLE_VALUES = [
  '2025年6月16日',   // 実施年月日 / 飛行年月日
  'ハミング太郎',      // 実施者名 / 飛行させた者の氏名
  'テクニカルセンター', // 実施場所 / 離陸場所 / 着陸場所
  '',          // 登録記号
  '02D3D1',          // 登録記号（続き）
  '12時5分',          // 離陸時刻
  '12時50分',         // 着陸時刻
  '45分'              // 飛行時間 / 総飛行時間
];
function stripVariableValues(text){
  let t = text;
  VARIABLE_VALUES.forEach(v => { t = t.split(v).join(''); });
  return t;
}

function judge(expectedText, answerText){
  // strip stage directions in parentheses (e.g. "（8の字飛行 2周）") — these
  // describe what's happening, they aren't words the pilot actually says.
  const noStageDirections = expectedText.replace(/（[^）]*）/g, '').replace(/\([^)]*\)/g, '');
  const gradingText = stripVariableValues(noStageDirections);
  const chunks = gradingText.split(/[、。]/).map(s=>s.trim()).filter(s=>s.length>=2);
  const results = chunks.map(c => ({ chunk:c, score: bestMatchScore(c, answerText) }));
  const matched = results.filter(r => r.score >= 0.45);
  const ratio = chunks.length ? matched.length/chunks.length : 1;
  return { pass: ratio >= 0.6, ratio, results };
}

      <label>男性の声

        </select>
      </label>
      <span class="listen-btn" id="previewVoiceBtn">🔊 試聴</span>
    ` : ''}
  `;
  document.getElementById('autoPlayChk').onchange = e => { autoPlay = e.target.checked; };
  if(hasSTT){
    document.getElementById('autoJudgeChk').onchange = e => { autoJudge = e.target.checked; };
  }
  if(hasTTS){
    refreshVoiceSelect();
    document.getElementById('examinerGenderSelect').onchange = e => { examinerGender = e.target.value; render(); };
    document.getElementById('femaleVoiceSelect').onchange = e => { voiceURIByGender.female = e.target.value; };
    document.getElementById('maleVoiceSelect').onchange = e => { voiceURIByGender.male = e.target.value; };
    document.getElementById('previewExaminerBtn').onclick = () => speakExaminer('これから飛行前点検を行います。点検内容をはっきりとした声で行ってください。');
    document.getElementById('voiceSelect').onchange = e => { selectedVoiceURI = e.target.value; };
    document.getElementById('rateSelect').onchange = e => { speechRate = parseFloat(e.target.value); };
    document.getElementById('previewVoiceBtn').onclick = () => speak('これから飛行前点検を行います。点検用紙を使って点検内容をはっきりとした声で行ってください。');
  }

  const note = document.getElementById('unsupportedNote');
  const notes = [];
  if(!hasSTT){
    notes.push('この端末・ブラウザは音声認識に対応していません。下部のテキスト欄に発言内容を入力して判定してください（読み上げ機能は利用できます）。');
  }
  if(hasTTS && availableVoices.length && availableVoices.every(v => v.localService !== false)){
    notes.push('この端末では標準の日本語音声（ロボット的な声）しか見つかりませんでした。より自然な声にするには、端末やブラウザの設定でネットワーク音声・高品質音声（例: Chromeの「Google 日本語」、iOS/macOSの「拡張版/プレミアム」音声）を追加してから、上の音声欄で選び直してください。');
  }
  if(hasTTS && availableVoices.length && isFallbackVoice(examinerGender)){
    notes.push(`この端末には${examinerGender==='female'?'女性':'男性'}の声として明確に判別できる音声が見つからなかったため、既存の声のピッチを変えて代用しています。端末に別の日本語音声を追加すると改善する場合があります。`);
  }
  note.innerHTML = notes.map(n => `<div class="unsupported">${n}</div>`).join('');
}

// ---- tabs ----
function buildTabs(){
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  const options = [{label:'通し（全編）', turns: ALL_TURNS}].concat(
    SECTIONS.map(s => ({label:s.title, turns:s.turns}))
  );
  options.forEach(opt=>{
    const btn = document.createElement('div');
    btn.className = 'tab' + (opt.label===currentFlow.label ? ' active':'');
    btn.textContent = opt.label;
    btn.onclick = () => { selectFlow(opt); };
    tabsEl.appendChild(btn);
  });
}
function selectFlow(opt){
  currentFlow = opt;
  idx = 0;
  history = [];
  buildTabs();
  render();
}

function buildPhaseTrack(){
  const track = document.getElementById('phaseTrack');
  track.innerHTML='';
  const pairCount = Math.ceil(currentFlow.turns.length/2);
  for(let i=0;i<pairCount;i++){
    const d = document.createElement('div');
    d.className = 'dot' + (i < idx/2 ? ' done' : (i===Math.floor(idx/2) ? ' current' : ''));
    track.appendChild(d);
  }
}
// ---- main render ----
function render(){
  buildPhaseTrack();
  const stage = document.getElementById('stage');
  stage.innerHTML = '';

  if(history.length){
    const h = document.createElement('div');
    h.className = 'panel history';
    history.forEach(item=>{
      const row = document.createElement('div');
      row.className = 'history-item ' + (item.speaker!=='試験官' ? 'operator':'examiner');
      row.innerHTML = `<div class="role-tag"><span class="left"><span class="sq"></span>${item.speaker}</span></div><div class="body">${item.text}</div>`;
      h.appendChild(row);
    });
    stage.appendChild(h);
  }

  if(idx >= currentFlow.turns.length){
    window.speechSynthesis && window.speechSynthesis.cancel();
    const c = document.createElement('div');
    c.className = 'panel complete';
    c.innerHTML = `<div class="big">— 判定終了 —</div><p>すべての項目に正解しました。お疲れさまでした。</p>`;
    const btn = document.createElement('button');
    btn.className='primary';
    btn.textContent='最初からやり直す';
    btn.onclick = ()=>{ idx=0; history=[]; render(); };
    c.appendChild(document.createElement('br'));
    c.appendChild(btn);
    stage.appendChild(c);
    return;
  }

  const examinerTurn = currentFlow.turns[idx];
  const operatorTurn = currentFlow.turns[idx+1];

  const ePanel = document.createElement('div');
  ePanel.className = 'panel';
  ePanel.innerHTML = `
    <div class="meta-row"><span>試験官 発言</span><span>STEP ${Math.floor(idx/2)+1} / ${Math.ceil(currentFlow.turns.length/2)}</span></div>
    <div class="examiner-row">
      <div class="avatar-slot">${getExaminerAvatarSVG(examinerGender)}</div>
      <div class="examiner-body">
        <div class="role-tag">
          <span class="left"><span class="sq"></span>試験官（${examinerGender==='female'?'女性':'男性'}）</span>
          ${hasTTS ? '<span class="listen-btn" id="replayBtn">🔊 もう一度聞く</span>' : ''}
        </div>
        <div class="examiner-text">${examinerTurn.text}</div>
      </div>
    </div>
  `;
  stage.appendChild(ePanel);
  if(hasTTS){
    document.getElementById('replayBtn').onclick = () => speakExaminer(examinerTurn.text);
  }

  const iPanel = document.createElement('div');
  iPanel.className = 'panel';
  iPanel.innerHTML = `<div class="role-tag"><span class="left"><span class="sq"></span>${operatorTurn.speaker}（あなたの応答）</span></div>`;

  const pttArea = document.createElement('div');
  pttArea.className = 'ptt-area';

  let liveTranscript = '';
  const transcriptBox = document.createElement('div');
  transcriptBox.className = 'transcript-box placeholder';
  transcriptBox.textContent = hasSTT ? 'PTTボタンを押して話してください…' : '';

  const manualTa = document.createElement('textarea');
  manualTa.className = 'manual';
  manualTa.placeholder = hasSTT ? '（音声認識の結果をここで編集できます。手入力も可）' : `ここに${operatorTurn.speaker}としての発言を入力してください…`;

  if(hasSTT){
    const pttBtn = document.createElement('button');
    pttBtn.className = 'ptt-btn';
    pttBtn.textContent = '🎙 押して話す（PTT）';
    pttArea.appendChild(pttBtn);
    const hint = document.createElement('div');
    hint.className = 'ptt-hint';
    hint.textContent = `ボタンを押している間、${operatorTurn.speaker}として声に出して発言してください。離すと送信されます。`;
    pttArea.appendChild(hint);
    pttArea.appendChild(transcriptBox);

    let recActive = false;
    recognition.onresult = (e) => {
      let finalText = '';
      let interim = '';
      for(let i=0;i<e.results.length;i++){
        if(e.results[i].isFinal) finalText += e.results[i][0].transcript;
        else interim += e.results[i][0].transcript;
      }
      liveTranscript = (finalText + interim).trim();
      transcriptBox.textContent = liveTranscript || 'PTTボタンを押して話してください…';
      transcriptBox.classList.toggle('placeholder', !liveTranscript);
      manualTa.value = liveTranscript;
    };
    recognition.onerror = () => { stopRec(); };
    recognition.onend = () => {
      pttBtn.classList.remove('active');
      pttBtn.textContent = '🎙 押して話す（PTT）';
      recActive = false;
      if(autoJudge && liveTranscript.trim()){
        doJudge(liveTranscript, operatorTurn.text, iPanel, transcriptBox, manualTa);
      }
    };
    function startRec(){
      if(recActive) return;
      window.speechSynthesis && window.speechSynthesis.cancel();
      liveTranscript = '';
      transcriptBox.textContent = '認識中…';
      transcriptBox.classList.remove('placeholder');
      try{ recognition.start(); }catch(e){}
      recActive = true;
      pttBtn.classList.add('active');
      pttBtn.textContent = '🔴 送信中（離すと確定）';
    }
    function stopRec(){
      if(!recActive) return;
      try{ recognition.stop(); }catch(e){}
    }
    pttBtn.addEventListener('mousedown', startRec);
    pttBtn.addEventListener('mouseup', stopRec);
    pttBtn.addEventListener('mouseleave', ()=>{ if(recActive) stopRec(); });
    pttBtn.addEventListener('touchstart', e=>{ e.preventDefault(); startRec(); });
    pttBtn.addEventListener('touchend', e=>{ e.preventDefault(); stopRec(); });
  }

  iPanel.appendChild(pttArea);
  iPanel.appendChild(manualTa);

  const controls = document.createElement('div');
  controls.className = 'controls';
  const judgeBtn = document.createElement('button');
  judgeBtn.className = 'primary';
  judgeBtn.textContent = 'このテキストで判定する';
  judgeBtn.onclick = () => doJudge(manualTa.value, operatorTurn.text, iPanel, transcriptBox, manualTa);
  controls.appendChild(judgeBtn);
  iPanel.appendChild(controls);

  const verdictHolder = document.createElement('div');
  verdictHolder.id = 'verdictHolder';
  iPanel.appendChild(verdictHolder);

  stage.appendChild(iPanel);

  if(autoPlay && hasTTS){
    setTimeout(() => speakExaminer(examinerTurn.text), 250);
  }
}

function doJudge(answer, expectedText, iPanel, transcriptBox, manualTa){
  const holder = iPanel.querySelector('#verdictHolder');
  holder.innerHTML = '';
  if(!answer || !answer.trim()) return;

  const result = judge(expectedText, answer);
  const v = document.createElement('div');
  v.className = 'verdict ' + (result.pass ? 'pass':'fail');
  const chunksHtml = result.results.map(r =>
    `<span class="chunk ${r.score>=0.45?'ok':'ng'}">${r.chunk}</span>`
  ).join('');

  if(result.pass){
    v.innerHTML = `<div class="verdict-head">判定：合格</div>次の項目に進みます。<div class="chunks">${chunksHtml}</div>`;
    holder.appendChild(v);
    setTimeout(()=>{
      history.push({ speaker: currentFlow.turns[idx].speaker, text: currentFlow.turns[idx].text });
      history.push({ speaker: currentFlow.turns[idx+1].speaker, text: answer });
      idx += 2;
      render();
    }, 1100);
  } else {
    v.innerHTML = `<div class="verdict-head">判定：要修正<span class="listen-btn" id="listenCorrectBtn" style="font-family:'IBM Plex Mono',monospace;">🔊 正しい言い方を聞く</span></div>
      いくつかの要点が不足しています。言い直してください。
      <div class="chunks">${chunksHtml}</div>
      <div class="ref-text"><b>正しくは：</b>${expectedText}</div>`;
    holder.appendChild(v);
    const lb = document.getElementById('listenCorrectBtn');
    if(lb && hasTTS) lb.onclick = () => speak(expectedText.replace(/（[^）]*）/g, '').replace(/\([^)]*\)/g, ''));
    if(transcriptBox){ transcriptBox.textContent = 'PTTボタンを押して、もう一度話してください…'; transcriptBox.classList.add('placeholder'); }
    if(manualTa) manualTa.value = '';
  }
}

// ---- answer sheet downloads ----
function downloadSectionAsText(section){
  let content = section.title + '（回答用紙・模範解答）\n' + '='.repeat(20) + '\n\n';
  section.turns.forEach(t => { content += `【${t.speaker}】\n${t.text}\n\n`; });
  const blob = new Blob([content], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = section.title + '_回答用紙.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
function buildAnswerSheetButtons(){
  const holder = document.getElementById('answerSheetButtons');
  if(!holder) return;
  holder.innerHTML = '';
  SECTIONS.forEach(section => {
    const btn = document.createElement('button');
    btn.textContent = '⬇ ' + section.title;
    btn.onclick = () => downloadSectionAsText(section);
    holder.appendChild(btn);
  });
  const allBtn = document.createElement('button');
  allBtn.className = 'primary';
  allBtn.textContent = '⬇ 全4項目まとめて';
  allBtn.onclick = () => {
    let content = '2等無人航空機操縦士 実技審査 回答用紙（模範解答）\n' + '='.repeat(30) + '\n\n';
    SECTIONS.forEach(section => {
      content += section.title + '\n' + '-'.repeat(20) + '\n';
      section.turns.forEach(t => { content += `【${t.speaker}】\n${t.text}\n\n`; });
      content += '\n';
    });
    const blob = new Blob([content], {type:'text/plain;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '実技審査_回答用紙_全項目.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  };
  holder.appendChild(allBtn);
}

buildAnswerSheetButtons();
buildSettings();
buildTabs();
render();
</script>
</body>
</html>
